services:
  resolveiq:
    build: .
    container_name: resolveiq_service
    ports:
      - "8080:8080"
    environment:
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

